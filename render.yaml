databases:
  - name: blacket-db
    databaseName: blacket
    user: blacket
    plan: free

services:
  - type: keyvalue
    name: blacket-redis
    plan: free
    ipAllowList: []

  - type: web
    name: blacket
    runtime: node
    plan: free
    rootDir: .
    buildCommand: curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH" && bun install --cwd packages/types && bun run --cwd packages/types build && bun install --cwd packages/common && bun run --cwd packages/common build && bun install --cwd packages/mail-templates && bun run --cwd packages/mail-templates build && bun install --cwd backend && cd backend && bunx prisma generate --schema ../packages/core/prisma && cd .. && bun run --cwd packages/types build && bun run --cwd packages/common build && bun install --cwd frontend && bun run --cwd frontend build && cd backend && bunx prisma db push --schema ../packages/core/prisma && bun run build
    startCommand: node backend/dist/main.js
    healthCheckPath: /api
    envVars:
      - key: SERVER_PORT
        value: $PORT
      - key: SERVER_TYPE
        value: PROD
      - key: SERVER_BASE_URL
        value: https://cablet-96ik.onrender.com
      - key: SERVER_DATABASE_URL
        fromDatabase:
          name: blacket-db
          property: connectionString
      - key: SERVER_REDIS_URL
        fromService:
          type: keyvalue
          name: blacket-redis
          property: connectionString
      - key: SERVER_S3_REGION
        value: us-east-2
      - key: SERVER_BLOCK_PROXIES
        value: "false"
      - key: SERVER_ALLOW_MULTIPLE_ACCOUNTS
        value: "false"
      - key: SERVER_REGISTRATION_ENABLED
        value: "true"
      - key: SERVER_REGISTRATION_BYPASS_PASSWORD
        value: ""
      - key: VITE_BACKEND_URL
        value: https://cablet-96ik.onrender.com
      - key: VITE_ALLOWED_ORIGINS
        value: https://cablet-96ik.onrender.com
      - key: VITE_MEDIA_URL
        value: https://media.blacket.org
      - key: VITE_MEDIA_BACKUP_URL
        value: https://blacket-media.s3.us-east-2.amazonaws.com
      - key: VITE_CDN_URL
        value: https://cdn-dev.blacket.org
      - key: VITE_CDN_BACKUP_URL
        value: https://s3.us-east-2.amazonaws.com/cdn-dev.blacket.org
      - key: VITE_INFORMATION_NAME
        value: Blacket
      - key: VITE_INFORMATION_PRONUNCIATION
        value: Black-it
      - key: VITE_INFORMATION_VERSION
        value: 3.0.0
      - key: VITE_LEVEL_DIFFICULTY
        value: "0.75"
      - key: VITE_BASE_SHINY_CHANCE
        value: "1"
