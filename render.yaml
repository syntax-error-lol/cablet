databases:
  - name: blacket-db
    databaseName: blacket
    user: blacket
    plan: free

services:
  - type: web
    name: blacket-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: git submodule update --init --recursive && bun install --cwd backend && bun run --cwd backend prisma:gen && bun run --cwd backend build
    startCommand: bun run --cwd backend start:prod
    healthCheckPath: /api
    envVars:
      - key: SERVER_PORT
        value: $PORT
      - key: SERVER_TYPE
        value: PROD
      - key: SERVER_BASE_URL
        sync: false
      - key: SERVER_DATABASE_URL
        fromDatabase:
          name: blacket-db
          property: connectionString
      - key: SERVER_MAIL_HOST
        sync: false
      - key: SERVER_MAIL_PORT
        value: "587"
      - key: SERVER_MAIL_USER
        sync: false
      - key: SERVER_MAIL_PASSWORD
        sync: false
      - key: SERVER_MAIL_FROM
        sync: false
      - key: SERVER_STRIPE_SECRET_KEY
        sync: false
      - key: SERVER_STRIPE_WEBHOOK_SECRET_KEY
        sync: false
      - key: SERVER_STRIPE_PORTAL_CONFIGURATION_ID
        sync: false
      - key: SERVER_S3_ACCESS_KEY
        sync: false
      - key: SERVER_S3_SECRET_KEY
        sync: false
      - key: SERVER_S3_BUCKET
        sync: false
      - key: SERVER_S3_REGION
        value: us-east-2
      - key: SERVER_TURNSTILE_SECRET_KEY
        sync: false
      - key: SERVER_DISCORD_CLIENT_SECRET
        sync: false
      - key: SERVER_DISCORD_PAYMENT_WEBHOOK_URL
        sync: false
      - key: SERVER_DISCORD_CRYSTAL_PAYMENT_WEBHOOK_URL
        sync: false
      - key: SERVER_DISCORD_INVOICE_WEBHOOK_URL
        sync: false
      - key: SERVER_BLOCK_PROXIES
        value: "false"
      - key: SERVER_ALLOW_MULTIPLE_ACCOUNTS
        value: "false"
      - key: SERVER_REGISTRATION_ENABLED
        value: "false"
      - key: SERVER_REGISTRATION_BYPASS_PASSWORD
        sync: false
      - key: VITE_INFORMATION_NAME
        value: Blacket
      - key: VITE_INFORMATION_VERSION
        value: 3.0.0

  - type: web
    name: blacket-web
    runtime: static
    rootDir: .
    buildCommand: git submodule update --init --recursive && bun install --cwd frontend && bun run --cwd frontend build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_ALLOWED_ORIGINS
        sync: false
      - key: VITE_MEDIA_URL
        sync: false
      - key: VITE_MEDIA_BACKUP_URL
        sync: false
      - key: VITE_CDN_URL
        sync: false
      - key: VITE_CDN_BACKUP_URL
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: VITE_INFORMATION_NAME
        value: Blacket
      - key: VITE_INFORMATION_PRONUNCIATION
        value: Black-it
      - key: VITE_INFORMATION_DISCORD_INVITE
        sync: false
      - key: VITE_INFORMATION_VERSION
        value: 3.0.0
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
      - key: VITE_LEVEL_DIFFICULTY
        value: "0.75"
      - key: VITE_BASE_SHINY_CHANCE
        value: "1"
