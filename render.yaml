databases:
  - name: blacket-db
    databaseName: blacket
    user: blacket
    plan: free

services:
  - type: web
    name: blacket-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: git submodule update --init --recursive && (cd packages/common && bun install && bun run build && bun link) && (cd packages/types && bun install && bun run build && bun link) && (cd packages/mail-templates && bun install && bun run build && bun link) && (cd packages/core && bun link) && (cd backend && bun link @blacket/common && bun link @blacket/core && bun link @blacket/mail-templates && bun link @blacket/types && bun install && bun run prisma:gen && bun run build)
    startCommand: bun run --cwd backend start:prod
    healthCheckPath: /api
    envVars:
      - key: SERVER_PORT
        value: $PORT
      - key: SERVER_TYPE
        value: PROD
      - key: SERVER_DATABASE_URL
        fromDatabase:
          name: blacket-db
          property: connectionString
      - key: SERVER_BLOCK_PROXIES
        value: "false"
      - key: SERVER_ALLOW_MULTIPLE_ACCOUNTS
        value: "true"
      - key: SERVER_REGISTRATION_ENABLED
        value: "true"
      - key: VITE_INFORMATION_NAME
        value: Blacket
      - key: VITE_INFORMATION_VERSION
        value: 3.0.0
      - key: SERVER_BASE_URL
        sync: false

  - type: web
    name: blacket-web
    runtime: static
    rootDir: .
    buildCommand: git submodule update --init --recursive && (cd packages/types && bun install && bun run build && bun link) && (cd frontend && bun install && bun link @blacket/types && bun run build)
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_INFORMATION_NAME
        value: Blacket
      - key: VITE_INFORMATION_PRONUNCIATION
        value: Black-it
      - key: VITE_INFORMATION_VERSION
        value: 3.0.0
      - key: VITE_LEVEL_DIFFICULTY
        value: "0.75"
      - key: VITE_BASE_SHINY_CHANCE
        value: "1"
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_ALLOWED_ORIGINS
        sync: false
